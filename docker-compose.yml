
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: predictx-backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: predictx-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
